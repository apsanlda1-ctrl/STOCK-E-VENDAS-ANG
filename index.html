<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão AO - Stock & Faturação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- MENU LATERAL -->
    <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col justify-between border-r border-slate-800">
        <div>
            <!-- Logo / Header -->
            <div class="p-6 border-b border-slate-800/80 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold text-lg">
                    AO
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white">GESTÃO AO</h1>
                    <p class="text-xs text-slate-400">Stock, Vendas & IVA</p>
                </div>
            </div>
            
            <!-- Navegação -->
            <nav class="p-4 space-y-1.5">
                <button onclick="app.mudarSecao('dashboard')" id="nav-dashboard" class="nav-btn w-full text-left px-4 py-3 rounded-xl transition text-sm font-medium flex items-center gap-3.5 hover:bg-slate-800/60 hover:text-white">
                    <span class="text-lg">📊</span> Dashboard Geral
                </button>
                <button onclick="app.mudarSecao('stock')" id="nav-stock" class="nav-btn w-full text-left px-4 py-3 rounded-xl transition text-sm font-medium flex items-center gap-3.5 hover:bg-slate-800/60 hover:text-white">
                    <span class="text-lg">📦</span> Gestão de Stock
                </button>
                <button onclick="app.mudarSecao('faturacao')" id="nav-faturacao" class="nav-btn w-full text-left px-4 py-3 rounded-xl transition text-sm font-medium flex items-center gap-3.5 hover:bg-slate-800/60 hover:text-white">
                    <span class="text-lg">🧾</span> POS & Faturação
                </button>
                <button onclick="app.mudarSecao('clientes')" id="nav-clientes" class="nav-btn w-full text-left px-4 py-3 rounded-xl transition text-sm font-medium flex items-center gap-3.5 hover:bg-slate-800/60 hover:text-white">
                    <span class="text-lg">👥</span> Clientes & NIF
                </button>
            </nav>
        </div>

        <!-- Rodapé do Menu -->
        <div class="p-4 m-4 rounded-xl bg-slate-950/60 border border-slate-800/80 flex items-center justify-between text-xs">
            <span class="text-slate-400">Moeda Oficial</span>
            <span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 font-bold border border-emerald-500/20">Kwanza (Kz)</span>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <!-- Barra Superior -->
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-xs z-10">
            <div>
                <h2 id="titulo-secao" class="text-xl font-bold text-slate-800">Dashboard</h2>
                <p class="text-xs text-slate-500 mt-0.5">Painel de controlo integrado em tempo real</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <div id="data-atual" class="text-xs font-semibold text-slate-700 capitalize"></div>
                    <div class="text-[10px] text-emerald-600 font-medium">● Sistema Operacional</div>
                </div>
            </div>
        </header>

        <!-- Área Dinâmica -->
        <div id="conteudo-principal" class="p-8 flex-1 fade-in">
            <!-- Conteúdo injetado via app.js -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="./db.js"></script>
    <script src="./app.js"></script>
</body>
</html>
